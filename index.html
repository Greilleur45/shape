<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shape</title>
<meta name="theme-color" content="#0f1115" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shape">
<meta name="robots" content="noindex">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="css/style.css">
<script src="vendor/qrcode.js" defer></script>
<script type="module" src="js/app.js"></script>
</head>
<body>
<header>
  <span class="logo">SHAPE</span>
  <button id="syncdot" class="dot off" aria-label="État de la synchronisation"></button>
</header>
<main id="view"></main>
<div id="timer" hidden>
  <button data-t="-15">−15</button>
  <span id="timer-t">0:00</span>
  <button data-t="15">+15</button>
  <button data-t="skip" aria-label="Arrêter">✕</button>
</div>
<div id="toast" hidden></div>
<nav>
  <button data-tab="today"><span>🏋️</span>Aujourd'hui</button>
  <button data-tab="plan"><span>🗓️</span>Programme</button>
  <button data-tab="stats"><span>📈</span>Stats</button>
  <button data-tab="settings"><span>⚙️</span>Réglages</button>
</nav>
</body>
</html>
